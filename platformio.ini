; PlatformIO Project Configuration File
;
; GNSS Alarm Clock — custom SAMD51J19A board (Adafruit Metro M4 compatible)
; Hardware: ST7789 284x76 color TFT (SPI), Quectel L86 GNSS (Serial1),
;           RV-3028-C7 RTC (I2C), TPA2016D2 amp (I2C) + DAC0 audio,
;           LTC3226 supercap charger, 3x LED sections, 4 buttons,
;           QSPI flash (tunes; 16MB W25Q128 on assembled boards), LIS3DH accel.

[platformio]
; ---------------------------------------------------------------------------
; MCU SELECT — pick the default build here (or pass `pio run -e <env>`):
;   adafruit_metro_m4   SAMD51J19A, 512 KB flash  (current prototype)
;   metro_m4_j20        SAMD51J20A, 1 MB flash    (next revision)
;   sim / sim_j20       same two, plus the serial GNSS simulator (-DGNSS_SIM)
; The J20 uses boards/samd51j20a_metro.json + ld/samd51j20a_*.ld (1 MB / 256 KB).
; ---------------------------------------------------------------------------
default_envs = adafruit_metro_m4

[env:adafruit_metro_m4]
platform = atmelsam
board = adafruit_metro_m4
framework = arduino

; TinyUSB stack (needed for USB mass-storage tune upload)
build_flags =
    -DUSE_TINYUSB
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Wno-unused-variable

lib_deps =
    lvgl/lvgl@9.5.0
    mikalhart/TinyGPSPlus@1.0.3
    adafruit/Adafruit SPIFlash@5.1.1
    adafruit/SdFat - Adafruit Fork@2.3.103
    ; TinyUSB pinned to 2.4.1: the version that enumerates on this core. The
    ; core bundles 3.1.0, but relying on it (no lib_dep) breaks USB enumeration
    ; (device descriptor read error -110); forcing 3.7.7 clashes with the
    ; bundled copy (TU_RESERVED/TU_COUNTER redefs). 2.4.1 is the compatible max.
    adafruit/Adafruit TinyUSB Library@2.4.1
    adafruit/Adafruit LIS3DH@1.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    khoih-prog/FlashStorage_SAMD@1.3.2
    constiko/RTC RV-3028-C7 Arduino Library@2.1.0

board_build.usb_product = "GNSS Alarm Clock"
board_build.usb_manufacturer = "K. Haaland"

monitor_speed = 115200

; SAMD51J20A build (next board revision): same firmware, 1 MB flash / 256 KB
; RAM. Custom board def in boards/, custom linker script in ld/. NOTE: the
; stock Metro M4 UF2 bootloader is built for the J19 — flash the J20 over SWD
; (openocd .bin @ 0x4000), or build a J20 uf2-samdx1 for drag-and-drop.
[env:metro_m4_j20]
extends = env:adafruit_metro_m4
board = samd51j20a_metro
board_build.ldscript = ld/samd51j20a_flash_with_bootloader.ld

; Simulated GNSS: feed lat/lon (+ UTC) over the USB serial console instead of a
; real fix, to test the timezone/clock logic on-device. Build/flash with
; `pio run -e sim -t upload`, open the monitor, and type `help`. Identical to
; the default firmware plus -DGNSS_SIM (SimConsole active, L86 PMTK init skipped).
[env:sim]
extends = env:adafruit_metro_m4
build_flags = ${env:adafruit_metro_m4.build_flags} -DGNSS_SIM=1
board_build.usb_product = "GNSS Alarm Clock (SIM)"

; Simulator on the J20
[env:sim_j20]
extends = env:metro_m4_j20
build_flags = ${env:adafruit_metro_m4.build_flags} -DGNSS_SIM=1
board_build.usb_product = "GNSS Alarm Clock (SIM)"

; Minimal USB-CDC diagnostic (isolates TinyUSB 3.1.0 enumeration)
[env:diag]
platform = atmelsam
board = adafruit_metro_m4
framework = arduino
build_flags = -DUSE_TINYUSB
build_src_filter = +<../diag/main_diag.cpp>
board_build.usb_product = "GNSS Diag"
board_build.usb_manufacturer = "K. Haaland"
monitor_speed = 115200

; Host-side unit tests for the timezone engine: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = +<Timezone.cpp>
build_flags = -Isrc -Iinclude
