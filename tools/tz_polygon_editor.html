<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GNSS Alarm Clock — Timezone Polygon Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 13px/1.45 system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 340px; min-width: 340px; display: flex; flex-direction: column;
          border-right: 1px solid #ccc; background: #fafafa; }
  #map { flex: 1; }
  h1 { font-size: 15px; margin: 10px 12px 2px; }
  .sub { color: #666; margin: 0 12px 8px; font-size: 12px; }
  .bar { display: flex; gap: 6px; padding: 6px 12px; flex-wrap: wrap; }
  button { font: inherit; padding: 5px 10px; border: 1px solid #bbb; border-radius: 5px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f0f0f0; }
  button.primary { background: #2166c9; border-color: #2166c9; color: #fff; }
  button.primary:hover { background: #1b56aa; }
  button.on { background: #2166c9; color: #fff; border-color: #2166c9; }
  button.small { padding: 1px 6px; font-size: 12px; }
  #zonelist { flex: 1; overflow-y: auto; margin: 4px 0; border-top: 1px solid #ddd; }
  .zrow { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 12px;
          border-bottom: 1px solid #eee; cursor: pointer; }
  .zrow.sel { background: #dcebff; }
  .zrow .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .zrow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zrow .nm small { color: #888; }
  .zrow .warn { color: #c26400; }
  #detail { border-top: 1px solid #ddd; padding: 8px 12px; background: #f2f2f2; }
  #detail label { display: block; font-size: 11px; color: #555; margin-top: 6px; }
  #detail input { width: 100%; font: inherit; padding: 4px 6px; border: 1px solid #bbb;
                  border-radius: 4px; }
  #detail .hint { font-size: 11px; color: #777; margin-top: 6px; }
  #status { padding: 5px 12px; font-size: 11px; color: #555; border-top: 1px solid #ddd;
            background: #f2f2f2; white-space: nowrap; }
  #drawbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
             z-index: 1000; background: #fff; border: 1px solid #bbb; border-radius: 6px;
             padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: none;
             align-items: center; gap: 8px; }
  /* modal */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 2000;
           display: none; align-items: center; justify-content: center; }
  #modal .box { background: #fff; border-radius: 8px; width: min(860px, 92vw);
                max-height: 90vh; display: flex; flex-direction: column; padding: 14px; }
  #modal h2 { margin: 0 0 6px; font-size: 15px; }
  #modal textarea { width: 100%; flex: 1; min-height: 320px; font: 12px/1.35 ui-monospace,
                    Consolas, monospace; white-space: pre; }
  #modal .warns { color: #b00; font-size: 12px; margin: 6px 0; max-height: 90px; overflow: auto; }
  #modal .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end;
                align-items: center; }
  /* map handles */
  .vh { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
        background: #fff; border: 2px solid #d33; cursor: move; }
  .mh { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
        background: #fff; border: 2px solid #d33; opacity: .45; cursor: copy; }
  .leaflet-container { cursor: default; }
  .drawing .leaflet-container { cursor: crosshair; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Timezone Polygon Editor</h1>
    <p class="sub">Draws <code>TimezonePolyData.h</code> for the GNSS Alarm Clock.
       Zones are matched top-down (first hit wins), before the box table.</p>
    <div class="bar">
      <button id="bNew" class="primary">✚ New polygon</button>
      <button id="bImport">Import…</button>
      <button id="bExport">Export…</button>
      <button id="bProbe" title="Click the map to test which zone the firmware would pick">🔍 Probe</button>
      <button id="bBoxes" title="Show the 213 kZones boxes from Timezone.cpp as a reference layer">▦ Boxes</button>
      <button id="bGoogle" title="Use Google Maps base layers (needs your own Maps JavaScript API key)">🔑 Google</button>
    </div>
    <div id="zonelist"></div>
    <div id="detail" hidden>
      <label>IANA name (max 19 chars)</label>
      <input id="fName" maxlength="19" list="dlNames" spellcheck="false">
      <label>POSIX TZ string (max 47 chars)</label>
      <input id="fPosix" maxlength="47" list="dlPosix" spellcheck="false">
      <div class="hint" id="fInfo"></div>
      <div class="hint">Drag ⬤ to move a vertex, drag a faint ⬤ between two
        vertices to insert one, right-click a vertex to delete it.</div>
    </div>
    <div id="status">–</div>
  </div>
  <div id="map"></div>
</div>
<div id="drawbar">
  <span id="drawinfo">0 points — click the map to add</span>
  <button id="bFinish" class="primary">Finish</button>
  <button id="bCancel">Cancel</button>
</div>
<div id="modal">
  <div class="box">
    <h2 id="mTitle"></h2>
    <div id="mHelp" class="sub" style="margin:0 0 8px"></div>
    <div id="mWarns" class="warns"></div>
    <textarea id="mText" spellcheck="false"></textarea>
    <div class="row">
      <input type="file" id="mFile" accept=".h,.json,.txt" style="display:none">
      <button id="mLoad">Load file…</button>
      <label id="mMergeWrap" style="font-size:12px"><input type="checkbox" id="mMerge">
        merge on top (keep existing, imported win)</label>
      <span style="flex:1"></span>
      <button id="mCopy">Copy</button>
      <button id="mDownload">Download</button>
      <button id="mApply" class="primary">Import</button>
      <button id="mClose">Close</button>
    </div>
  </div>
</div>
<datalist id="dlNames"></datalist>
<datalist id="dlPosix"></datalist>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.1/dist/Leaflet.GoogleMutant.js"></script>

// ------------------------------------------------------------------ map ----
// Carto is the default base map: openstreetmap.org's own tile servers rate-
// limit/block heavy use, Carto serves the same OSM data without that. Google
// layers appear when an API key is supplied (🔑 button, official Maps JS API).
const carto = L.tileLayer(
  'https://{s}.basemap.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
  {maxZoom: 20, subdomains: 'abcd',
   attribution: '© OpenStreetMap contributors © CARTO'});
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, attribution: '© OpenStreetMap contributors'});
const sat = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom: 18, attribution: 'Imagery © Esri'});
const esriStreet = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  {maxZoom: 18, attribution: '© Esri'});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  {maxZoom: 15, subdomains: 'abc',
   attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)'});
const map = L.map('map', {layers: [carto], worldCopyJump: true}).setView([55, 15], 4);
const baseLayers = {'Carto (OSM data)': carto, 'Esri Street': esriStreet,
                    'OpenTopoMap': topo, 'OpenStreetMap': osm,
                    'Satellite (Esri)': sat};
const layersCtrl = L.control.layers(baseLayers).addTo(map);
L.control.scale().addTo(map);

const GKEY_LS = 'tzpolyeditor.gmapskey';
let googleLayers = null;
function loadGoogle() {
  const key = localStorage.getItem(GKEY_LS);
  if (!key || window.google) return;
  // Bad key / disabled billing lands here (Google's global callback). Without
  // this the Google layer just stops painting — if it was active, the whole
  // map looked dead. Restore OSM and say what happened.
  window.gm_authFailure = () => {
    if (googleLayers) {
      Object.values(googleLayers).forEach(l => {
        map.removeLayer(l);
        layersCtrl.removeLayer(l);
      });
      googleLayers = null;
    }
    carto.addTo(map);
    alert('Google rejected the Maps API key (invalid key or billing not ' +
          'enabled) — switched back to the OSM base map.\n' +
          'Fix or remove the key with the 🔑 Google button.');
  };
  window.__gmReady = () => {
    if (!L.gridLayer.googleMutant) {
      alert('Google Maps loaded but the Leaflet GoogleMutant plugin did not ' +
            '(unpkg.com blocked?) — staying on the OSM base map.');
      return;
    }
    googleLayers = {road: L.gridLayer.googleMutant({type: 'roadmap'}),
                    hyb:  L.gridLayer.googleMutant({type: 'hybrid'})};
    layersCtrl.addBaseLayer(googleLayers.road, 'Google Maps');
    layersCtrl.addBaseLayer(googleLayers.hyb, 'Google Hybrid');
    // Register only — keep the current (working) base map on screen. Pick the
    // Google layers from the layer switcher (top right) when wanted.
  };
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(key) + '&callback=__gmReady';
  s.onerror = () => alert('Could not load Google Maps — check the API key / network.');
  document.head.appendChild(s);
}
document.getElementById('bGoogle').addEventListener('click', () => {
  const cur = localStorage.getItem(GKEY_LS) || '';
  const key = prompt(
    'Google Maps JavaScript API key (stored only in this browser).\n' +
    'Get one at https://console.cloud.google.com (Maps JavaScript API).\n' +
    'Leave empty to remove the key.', cur);
  if (key === null) return;
  if (!key.trim()) { localStorage.removeItem(GKEY_LS); alert('Key removed — reload the page.'); return; }
  localStorage.setItem(GKEY_LS, key.trim());
  if (window.google) alert('Key saved.'); else loadGoogle();
});
loadGoogle();

const COLORS = ['#d33','#1c7c2e','#2166c9','#a01ec9','#c97a16','#0e8f8f',
                '#c92161','#5c7a00'];
const zoneLayer = L.layerGroup().addTo(map);
const editLayer = L.layerGroup().addTo(map);   // vertex/midpoint handles
const drawLayer = L.layerGroup().addTo(map);
const boxLayer  = L.layerGroup();              // reference boxes, toggled

function normLng(l) { return ((l + 180) % 360 + 360) % 360 - 180; }
let suppressMapClick = false;

// ------------------------------------------------------------ rendering ----
function zoneColor(i) { return COLORS[i % COLORS.length]; }

function zoneProblems(z) {
  const p = [];
  if (!z.name) p.push('name is empty');
  if (z.name.length > 19) p.push('name > 19 chars');
  if (!z.posix) p.push('POSIX string is empty');
  if (z.posix.length > 47) p.push('POSIX > 47 chars');
  if (z.verts.length < 3) p.push('fewer than 3 vertices');
  const lons = z.verts.map(v => v[1]);
  if (Math.max(...lons) - Math.min(...lons) > 180)
    p.push('spans > 180° longitude — crosses the antimeridian? split it');
  return p;
}

function renderMap() {
  zoneLayer.clearLayers();
  zones.forEach((z, i) => {
    const poly = L.polygon(z.verts, {
      color: zoneColor(i), weight: i === selected ? 3 : 2,
      fillOpacity: i === selected ? 0.25 : 0.12,
    }).addTo(zoneLayer);
    poly.bindTooltip(`${i + 1}. ${z.name || '(unnamed)'}`, {sticky: true});
    poly.on('click', () => {
      if (mode !== 'idle') return;
      suppressMapClick = true;
      select(i);
    });
  });
  renderHandles();
}

function renderHandles() {
  editLayer.clearLayers();
  if (selected < 0 || mode === 'draw') return;
  const z = zones[selected];
  const n = z.verts.length;
  z.verts.forEach((v, i) => {
    const m = L.marker(v, {draggable: true, icon: L.divIcon({className: 'vh'})})
      .addTo(editLayer);
    m.on('drag', e => {
      const ll = e.target.getLatLng();
      z.verts[i] = [ll.lat, normLng(ll.lng)];
      redrawSelectedPolygon();
    });
    m.on('dragend', () => { save(); renderMap(); renderList(); });
    m.on('contextmenu', e => {
      e.originalEvent.preventDefault();
      if (z.verts.length <= 3) return;
      z.verts.splice(i, 1);
      save(); renderMap(); renderList();
    });
  });
  // midpoints: drag to insert a vertex
  z.verts.forEach((v, i) => {
    const w = z.verts[(i + 1) % n];
    const mid = [(v[0] + w[0]) / 2, (v[1] + w[1]) / 2];
    const m = L.marker(mid, {draggable: true, icon: L.divIcon({className: 'mh'})})
      .addTo(editLayer);
    m.on('dragstart', () => { z.verts.splice(i + 1, 0, mid.slice()); });
    m.on('drag', e => {
      const ll = e.target.getLatLng();
      z.verts[i + 1] = [ll.lat, normLng(ll.lng)];
      redrawSelectedPolygon();
    });
    m.on('dragend', () => { save(); renderMap(); renderList(); });
  });
}

function redrawSelectedPolygon() {
  // light-weight redraw while dragging: only the selected zone's outline
  let k = 0;
  zoneLayer.eachLayer(l => { if (k++ === selected) l.setLatLngs(zones[selected].verts); });
}

function renderList() {
  const el = document.getElementById('zonelist');
  el.innerHTML = '';
  zones.forEach((z, i) => {
    const row = document.createElement('div');
    row.className = 'zrow' + (i === selected ? ' sel' : '');
    const probs = zoneProblems(z);
    row.innerHTML =
      `<span class="sw" style="background:${zoneColor(i)}"></span>` +
      `<span class="nm">${i + 1}. ${z.name ? esc(z.name) : '(unnamed)'} ` +
      `<small>${z.verts.length} pts</small>` +
      (probs.length ? ` <span class="warn" title="${esc(probs.join('; '))}">⚠</span>` : '') +
      `</span>` +
      `<button class="small" data-a="up" title="Higher priority">↑</button>` +
      `<button class="small" data-a="dn" title="Lower priority">↓</button>` +
      `<button class="small" data-a="zoom" title="Zoom to">⌖</button>` +
      `<button class="small" data-a="del" title="Delete">✕</button>`;
    row.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (a === 'up' && i > 0) { zones.splice(i - 1, 0, zones.splice(i, 1)[0]); selected = i - 1; }
      else if (a === 'dn' && i < zones.length - 1) { zones.splice(i + 1, 0, zones.splice(i, 1)[0]); selected = i + 1; }
      else if (a === 'zoom') { map.fitBounds(L.polygon(z.verts).getBounds().pad(0.3)); select(i); return; }
      else if (a === 'del') {
        if (!confirm(`Delete zone "${z.name || '(unnamed)'}"?`)) return;
        zones.splice(i, 1);
        if (selected === i) selected = -1; else if (selected > i) selected--;
      } else { select(i); return; }
      save(); refresh();
    });
    el.appendChild(row);
  });
  renderDetail();
}

function renderDetail() {
  const d = document.getElementById('detail');
  if (selected < 0) { d.hidden = true; return; }
  d.hidden = false;
  const z = zones[selected];
  document.getElementById('fName').value = z.name;
  document.getElementById('fPosix').value = z.posix;
  const probs = zoneProblems(z);
  document.getElementById('fInfo').textContent =
    `${z.verts.length} vertices` + (probs.length ? ' — ⚠ ' + probs.join('; ') : '');
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function select(i) { selected = i; refresh(); }
function refresh() { renderMap(); renderList(); }

document.getElementById('fName').addEventListener('input', e => {
  if (selected >= 0) { zones[selected].name = e.target.value; save(); renderList(); }
});
document.getElementById('fPosix').addEventListener('input', e => {
  if (selected >= 0) { zones[selected].posix = e.target.value; save(); renderList(); }
});

// datalists from reference boxes + zones
function fillDatalists() {
  const names = new Set(), posix = new Set();
  REF_BOXES.forEach(b => { names.add(b[4]); posix.add(b[5]); });
  zones.forEach(z => { if (z.name) names.add(z.name); if (z.posix) posix.add(z.posix); });
  document.getElementById('dlNames').innerHTML =
    [...names].sort().map(n => `<option value="${esc(n)}">`).join('');
  document.getElementById('dlPosix').innerHTML =
    [...posix].sort().map(n => `<option value="${esc(n)}">`).join('');
}

// -------------------------------------------------------------- drawing ----
const drawbar = document.getElementById('drawbar');
let drawLine = null;

function startDraw() {
  cancelModes();
  mode = 'draw';
  selected = -1;
  drawVerts = [];
  document.body.classList.add('drawing');
  map.doubleClickZoom.disable();
  drawbar.style.display = 'flex';
  updateDrawbar();
  refresh();
}

function updateDrawbar() {
  document.getElementById('drawinfo').textContent =
    `${drawVerts.length} point${drawVerts.length === 1 ? '' : 's'} — click the map to add, ` +
    `double-click/Enter to finish, Esc to cancel`;
  drawLayer.clearLayers();
  if (drawVerts.length) {
    drawLine = L.polyline(drawVerts, {color: '#d33', weight: 2}).addTo(drawLayer);
    if (drawVerts.length > 2)
      L.polyline([drawVerts[drawVerts.length - 1], drawVerts[0]],
                 {color: '#d33', weight: 1.5, dashArray: '5 5'}).addTo(drawLayer);
    drawVerts.forEach(v =>
      L.circleMarker(v, {radius: 4, color: '#d33', fillColor: '#fff', fillOpacity: 1})
        .addTo(drawLayer));
  }
}

function finishDraw() {
  if (mode !== 'draw') return;
  if (drawVerts.length < 3) { alert('A polygon needs at least 3 vertices.'); return; }
  zones.push({name: '', posix: '', verts: drawVerts});
  selected = zones.length - 1;
  endDraw();
  save(); refresh(); fillDatalists();
  document.getElementById('fName').focus();
}

function endDraw() {
  mode = 'idle';
  drawVerts = [];
  drawLayer.clearLayers();
  drawbar.style.display = 'none';
  document.body.classList.remove('drawing');
  setTimeout(() => map.doubleClickZoom.enable(), 100);
}

function cancelModes() {
  if (mode === 'draw') endDraw();
  if (mode === 'probe') toggleProbe(false);
}

document.getElementById('bNew').addEventListener('click', startDraw);
document.getElementById('bFinish').addEventListener('click', finishDraw);
document.getElementById('bCancel').addEventListener('click', endDraw);

map.on('click', e => {
  if (suppressMapClick) { suppressMapClick = false; return; }
  if (mode === 'draw') {
    drawVerts.push([e.latlng.lat, normLng(e.latlng.lng)]);
    updateDrawbar();
  } else if (mode === 'probe') {
    probeAt(e.latlng.lat, normLng(e.latlng.lng));
  } else {
    select(-1);
  }
});
map.on('dblclick', () => { if (mode === 'draw') finishDraw(); });
map.on('mousemove', e => {
  document.getElementById('status').textContent =
    `lat ${e.latlng.lat.toFixed(4)}, lon ${normLng(e.latlng.lng).toFixed(4)}` +
    `  |  ${zones.length} zones  |  autosaved locally`;
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') { cancelModes(); select(-1); closeModal(); }
  if (e.key === 'Enter' && mode === 'draw') finishDraw();
});

// ---------------------------------------------------------------- probe ----
// Mirrors the firmware exactly: centi-degree integer PNPOLY over the polygon
// list, then the kZones boxes (float degrees), then the longitude fallback.
function toCdeg(v) { return v >= 0 ? Math.floor(v * 100 + 0.5) : Math.ceil(v * 100 - 0.5); }

function pointInPoly(la, lo, verts) {
  let inside = false;
  const cv = verts.map(v => [toCdeg(v[0]), toCdeg(v[1])]);
  for (let i = 0, j = cv.length - 1; i < cv.length; j = i++) {
    const [latI, lonI] = cv[i], [latJ, lonJ] = cv[j];
    if ((latI > la) === (latJ > la)) continue;
    const s = (lonJ - lonI) * (la - latI) - (lo - lonI) * (latJ - latI);
    if (latJ > latI ? s > 0 : s < 0) inside = !inside;
  }
  return inside;
}

function firmwareLookup(lat, lon) {
  const la = toCdeg(lat), lo = toCdeg(lon);
  for (let i = 0; i < zones.length; i++) {
    const z = zones[i];
    if (z.verts.length < 3) continue;
    const lats = z.verts.map(v => toCdeg(v[0])), lons = z.verts.map(v => toCdeg(v[1]));
    if (la < Math.min(...lats) || la > Math.max(...lats) ||
        lo < Math.min(...lons) || lo > Math.max(...lons)) continue;
    if (pointInPoly(la, lo, z.verts))
      return {src: `polygon #${i + 1}`, name: z.name, posix: z.posix};
  }
  for (const b of REF_BOXES) {
    if (lat >= b[0] && lat <= b[1] && lon >= b[2] && lon <= b[3])
      return {src: 'box table', name: b[4], posix: b[5]};
  }
  let h = Math.round(lon / 15);
  h = Math.max(-12, Math.min(14, h));
  const name = h === 0 ? 'UTC' : (h > 0 ? `UTC+${h}` : `UTC-${-h}`);
  const posix = h === 0 ? 'UTC0' : (h > 0 ? `UTC-${h}` : `UTC${-h}`);
  return {src: 'longitude fallback', name, posix};
}

function probeAt(lat, lon) {
  const r = firmwareLookup(lat, lon);
  L.popup().setLatLng([lat, lon]).setContent(
    `<b>${esc(r.name)}</b><br><code>${esc(r.posix)}</code><br>` +
    `<small>via ${r.src} @ ${lat.toFixed(3)}, ${lon.toFixed(3)}</small>`).openOn(map);
}

function toggleProbe(on) {
  const want = on !== undefined ? on : mode !== 'probe';
  if (want && mode === 'draw') endDraw();
  mode = want ? 'probe' : 'idle';
  document.getElementById('bProbe').classList.toggle('on', want);
  if (!want) map.closePopup();
}
document.getElementById('bProbe').addEventListener('click', () => toggleProbe());

// ------------------------------------------------------- reference boxes ----
let boxesShown = false;
function buildBoxLayer() {
  boxLayer.clearLayers();
  REF_BOXES.forEach((b, i) => {
    const rect = L.rectangle([[b[0], b[2]], [b[1], b[3]]],
      {color: '#666', weight: 1, fillOpacity: 0.03, dashArray: '4 4'});
    const div = document.createElement('div');
    div.innerHTML = `<b>${esc(b[4])}</b><br><code>${esc(b[5])}</code><br>` +
      `<small>kZones box #${i + 1}</small><br>`;
    const btn = document.createElement('button');
    btn.textContent = 'Convert to polygon';
    btn.addEventListener('click', () => {
      zones.push({name: b[4], posix: b[5], verts: [
        [b[0], b[2]], [b[0], b[3]], [b[1], b[3]], [b[1], b[2]]]});
      selected = zones.length - 1;
      map.closePopup();
      save(); refresh(); fillDatalists();
    });
    div.appendChild(btn);
    rect.bindPopup(div);
    rect.addTo(boxLayer);
  });
}
document.getElementById('bBoxes').addEventListener('click', e => {
  boxesShown = !boxesShown;
  e.target.classList.toggle('on', boxesShown);
  if (boxesShown) { if (!boxLayer.getLayers().length) buildBoxLayer(); boxLayer.addTo(map); }
  else map.removeLayer(boxLayer);
});

// ---------------------------------------------------------------- export ----
function genHeader() {
  const warns = [];
  zones.forEach((z, i) => zoneProblems(z).forEach(p =>
    warns.push(`zone ${i + 1} "${z.name || '(unnamed)'}": ${p}`)));

  const totalVerts = zones.reduce((a, z) => a + z.verts.length, 0);
  let out = `// TimezonePolyData.h — polygon timezone regions, checked before the box table.
// GENERATED by tools/tz_polygon_editor.html — regenerate there, don't hand-edit.
// Load this file back into the editor (Import) to continue editing: the full
// editor state is embedded in the EDITOR-STATE comment at the bottom.
//
// Format: kPolyVerts holds flattened [lat, lon] pairs in centi-degrees
// (deg * 100, int16, 0.01 deg ~ 1.1 km). Each TzPolyZone references a slice
// of it plus a precomputed bounding box used as a cheap prefilter. Zones are
// matched top-down, first hit wins, before the kZones boxes in Timezone.cpp.
// Polygons must not cross the antimeridian — split them in the editor.
//
// ${zones.length} zone${zones.length === 1 ? '' : 's'}, ${totalVerts} vertices, ${totalVerts * 4} bytes of vertex data.

`;
  if (!zones.length) {
    out += `static const int16_t kPolyVerts[] = {0};

static const TzPolyZone kPolyZones[] = {
    {0, 0, 0, 0, 0, 0, "", ""}, // placeholder — no polygons defined
};

static const unsigned kPolyZoneCount = 0;
`;
  } else {
    out += 'static const int16_t kPolyVerts[] = {\n';
    let first = 0;
    const zrows = [];
    for (const z of zones) {
      const cv = z.verts.map(v => [toCdeg(v[0]), toCdeg(v[1])]);
      out += `    // ${z.name || '(unnamed)'} (${cv.length} verts)\n`;
      const flat = cv.flat();
      for (let i = 0; i < flat.length; i += 12)
        out += '    ' + flat.slice(i, i + 12).join(', ') + ',\n';
      const lats = cv.map(v => v[0]), lons = cv.map(v => v[1]);
      zrows.push(`    {${Math.min(...lats)}, ${Math.max(...lats)}, ` +
        `${Math.min(...lons)}, ${Math.max(...lons)}, ${first}, ${cv.length}, ` +
        `"${z.name}", "${z.posix}"},`);
      first += cv.length;
    }
    out += '};\n\nstatic const TzPolyZone kPolyZones[] = {\n' + zrows.join('\n') +
      '\n};\n\nstatic const unsigned kPolyZoneCount = ' +
      'sizeof(kPolyZones) / sizeof(kPolyZones[0]);\n';
  }
  out += '\n// EDITOR-STATE: ' + JSON.stringify({version: 1, zones}) + '\n';
  return {out, warns};
}

// ---------------------------------------------------------------- import ----
function doImport(text, merge) {
  const m = text.match(/EDITOR-STATE:\s*(\{.*\})/);
  let js = null;
  if (m) {
    try { js = JSON.parse(m[1]); } catch (e) { alert('EDITOR-STATE found but unparseable: ' + e); return false; }
  } else {
    try { js = JSON.parse(text); } catch (e) { /* not JSON */ }
  }
  if (js && Array.isArray(js.zones)) {
    // merge: imported zones go on top of the list = highest priority
    zones = merge ? js.zones.concat(zones) : js.zones;
    selected = -1;
    save(); refresh(); fillDatalists();
    alert(`Imported ${js.zones.length} polygon zone(s)` +
          (merge ? ` on top of the existing ${zones.length - js.zones.length}.` : '.'));
    return true;
  }
  // C++ box lines -> replace the reference layer
  const pat = /\{\s*(-?[\d.]+)f?\s*,\s*(-?[\d.]+)f?\s*,\s*(-?[\d.]+)f?\s*,\s*(-?[\d.]+)f?\s*,\s*"([^"]+)"\s*,\s*"([^"]+)"\s*\}/g;
  const boxes = [];
  let mm;
  while ((mm = pat.exec(text)))
    boxes.push([+mm[1], +mm[2], +mm[3], +mm[4], mm[5], mm[6]]);
  if (boxes.length) {
    REF_BOXES = boxes;
    buildBoxLayer(); fillDatalists();
    alert(`Replaced reference box layer with ${boxes.length} boxes from pasted kZones.`);
    return true;
  }
  alert('Nothing recognized: paste a generated TimezonePolyData.h, editor JSON, or kZones box lines.');
  return false;
}

// ----------------------------------------------------------------- modal ----
const modal = document.getElementById('modal');
let modalMode = 'export';

function openModal(m) {
  modalMode = m;
  const T = id => document.getElementById(id);
  modal.style.display = 'flex';
  T('mWarns').textContent = '';
  if (m === 'export') {
    const {out, warns} = genHeader();
    T('mTitle').textContent = 'Export TimezonePolyData.h';
    T('mHelp').textContent = 'Save this as src/TimezonePolyData.h (overwrite) and rebuild. ' +
      'Keep a copy — Import restores the editor state from it.';
    T('mText').value = out;
    T('mWarns').textContent = warns.length ? '⚠ ' + warns.join('  •  ') : '';
    T('mApply').style.display = 'none';
    T('mCopy').style.display = T('mDownload').style.display = '';
    T('mLoad').style.display = 'none';
    T('mMergeWrap').style.display = 'none';
  } else {
    T('mTitle').textContent = 'Import';
    T('mHelp').textContent = 'Paste a generated TimezonePolyData.h (restores polygons from its ' +
      'EDITOR-STATE line), editor JSON, or kZones box lines from Timezone.cpp ' +
      '(refreshes the reference box layer). Or load a file.';
    T('mText').value = '';
    T('mApply').style.display = '';
    T('mCopy').style.display = T('mDownload').style.display = 'none';
    T('mLoad').style.display = '';
    T('mMergeWrap').style.display = '';
  }
}
function closeModal() { modal.style.display = 'none'; }

document.getElementById('bExport').addEventListener('click', () => openModal('export'));
document.getElementById('bImport').addEventListener('click', () => openModal('import'));
document.getElementById('mClose').addEventListener('click', closeModal);
document.getElementById('mApply').addEventListener('click', () => {
  if (doImport(document.getElementById('mText').value,
               document.getElementById('mMerge').checked)) closeModal();
});
document.getElementById('mCopy').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('mText').value);
});
document.getElementById('mDownload').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('mText').value], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'TimezonePolyData.h';
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('mLoad').addEventListener('click', () =>
  document.getElementById('mFile').click());
document.getElementById('mFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById('mText').value = r.result; };
  r.readAsText(f);
  e.target.value = '';
});
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

// ----------------------------------------------------------------- init ----
fillDatalists();
refresh();
</script>
</body>
</html>
